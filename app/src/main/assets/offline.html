<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Bez pripojenia</title>
<style>
  html,body { margin:0; height:100%; background:#000; color:#fff; font-family:"Roboto",Arial,sans-serif; }
  main { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:36px; }
  h1 { font-size:64px; font-weight:700; margin:0; }
  p { font-size:32px; color:#8a8a8a; margin:0; }
  .row { display:flex; gap:28px; margin-top:24px; }
  button { background:#0c0c0c; color:#fff; border:3px solid #2a2a2a; border-radius:999px; font:inherit;
    font-size:36px; padding:22px 52px; transition:transform .12s; }
  button:focus { outline:none; border-color:#fff; transform:scale(1.05); background:#161616; }
</style>
</head>
<body>
<main>
  <h1>Televízor nie je pripojený na internet</h1>
  <p>Pripojte ho na Wi-Fi. Po pripojení sa menu načíta samo.</p>
  <div class="row">
    <button id="wifi" autofocus>Pripojiť Wi-Fi</button>
    <button id="retry">Skúsiť znova</button>
  </div>
</main>
<script>
  const K = window.Kiosk || { openWifi(){}, retry(){ location.reload(); } };
  const w=document.getElementById('wifi'), r=document.getElementById('retry');
  w.onclick=()=>K.openWifi(); r.onclick=()=>K.retry();
  w.focus();
  document.addEventListener('keydown', e=>{
    if (e.key==='ArrowRight') { r.focus(); e.preventDefault(); }
    if (e.key==='ArrowLeft')  { w.focus(); e.preventDefault(); }
  });
</script>
</body>
</html>
